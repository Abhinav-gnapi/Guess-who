<!DOCTYPE html>
<html>
<head>
  <title>Quiz Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 50%;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Admin – Quiz Results</h1>


<table>
  <thead>
    <tr>
      <th>User</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody id="resultsBody"></tbody>
</table>

<!-- <button id="clearBtn">Clear Results</button> -->

<script>
  const tbody = document.getElementById("resultsBody");

  function loadResults() {
    fetch("https://guess-who-amw8.onrender.com/admin/results")
      .then(res => res.json())
      .then(data => {
        tbody.innerHTML = "";

        if (!data || !data.results || Object.keys(data.results).length === 0) {
          return;
        }

        let leaderboard = [];

        for (const id in data.results) {
          leaderboard.push({
            username: data.results[id].username,
            score: data.results[id].score
          });
        }

        leaderboard.sort((a, b) => b.score - a.score);

        leaderboard.forEach(player => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${player.username}</td>
            <td>${player.score}</td>
          `;
          tbody.appendChild(row);
        });
      });
  }

  setInterval(loadResults, 3000);
  
  loadResults();
</script>


</body>
</html>
