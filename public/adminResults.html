<!DOCTYPE html>
<html>
<head>
  <title>Quiz Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 50%;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Admin – Quiz Results</h1>


<table>
  <thead>
    <tr>
      <th>User</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody id="resultsBody"></tbody>
</table>

<button id="clearBtn">Clear Results</button>

<script>
  const tbody = document.getElementById("resultsBody");
  const clearBtn = document.getElementById("clearBtn");

  function loadResults() {
    tbody.innerHTML = "";

    fetch("https://guess-who-amw8.onrender.com/admin/results")
      .then(res => res.json())
      .then(data => {
        let leaderboard = [];

        // collect all players
        data.forEach(entry => {
          for (const userId in entry.results) {
            leaderboard.push({
              username: entry.results[userId].username,
              score: entry.results[userId].score
            });
          }
        });

        // 🔥 SORT by score (HIGH → LOW)
        leaderboard.sort((a, b) => b.score - a.score);

        // render
        leaderboard.forEach(player => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${player.username}</td>
            <td>${player.score}</td>
          `;
          tbody.appendChild(row);
        });
      })
      .catch(err => console.error("Admin fetch error:", err));
  }

  clearBtn.addEventListener("click", () => {
    if (!confirm("Clear all results?")) return;

    fetch("https://guess-who-amw8.onrender.com/admin/results", {
      method: "DELETE"
    })
      .then(res => res.json())
      .then(() => {
        tbody.innerHTML = "";
        alert("Results cleared");
      });
  });

  loadResults();
</script>

</body>
</html>
