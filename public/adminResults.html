<!DOCTYPE html>
<html>
<head>
  <title>Quiz Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 50%;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Admin – Quiz Results</h1>

<table>
    <thead>
      <tr>
        <th>User</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>

  <script>
  const tbody = document.getElementById("resultsBody");

  fetch("https://guess-who-amw8.onrender.com/admin/results")
    .then(res => res.json())
    .then(data => {
      data.forEach(entry => {
        for (const user in entry.results) {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${entry.results[user].username}</td>
            <td>${entry.results[user].score}</td>
          `;
          tbody.appendChild(row);
        }
      });
    })
    .catch(err => console.error("Admin fetch error:", err));
</script>


</body>

</html>
