<!DOCTYPE html>
<html>
<head>
  <title>Quiz Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 50%;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Admin – Quiz Results</h1>


<table>
  <thead>
    <tr>
      <th>User</th>
      <th>Score</th>
    </tr>
  </thead>
  <tbody id="resultsBody"></tbody>
</table>

<!-- <button id="clearBtn">Clear Results</button> -->

<script>
  const tbody = document.getElementById("resultsBody");
  const statusText = document.getElementById("status");

  // CONNECT TO SERVER
  const socket = io("https://guess-who-amw8.onrender.com");

  // LISTEN FOR FINAL RESULTS
  socket.on("quizEnd", users => {
    tbody.innerHTML = "";
    statusText.innerText = "Quiz finished";

    if (!users || Object.keys(users).length === 0) {
      statusText.innerText = "No players participated";
      return;
    }

    // Convert users object → array
    const leaderboard = Object.values(users)
      .sort((a, b) => b.score - a.score);

    leaderboard.forEach(player => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${player.username}</td>
        <td>${player.score}</td>
      `;
      tbody.appendChild(row);
    });
  });

</script>
</body>
</html>
