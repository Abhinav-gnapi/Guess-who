<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background-color: #f4f6f8;
      }

      header {
        background-color: #2c3e50;
        color: #fff;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
      }

      #content {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
      }

      .card {
        background-color: #ffffff;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }

      .card h3 {
        margin-bottom: 15px;
        color: #333;
        font-size: 1.2rem;
        text-align: center;
      }

      .card img {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .delete-btn {
        padding: 8px 20px;
        border: none;
        border-radius: 5px;
        background-color: #e74c3c;
        color: #fff;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .delete-btn:hover {
        background-color: #c0392b;
      }

      @media (max-width: 500px) {
        header {
          font-size: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <header>Details</header>

    <div id="content"></div>

    <script>
      document.addEventListener("DOMContentLoaded", fetchDetails);

      const content = document.getElementById("content");

      function fetchDetails() {
        fetch("/details")
          .then((res) => res.json())
          .then((data) => detailsDisplay(data))
          .catch((err) => console.error("Error fetching details:", err));
      }

      function detailsDisplay(details) {
        content.innerHTML = "";

        details.forEach((item) => {
          const card = document.createElement("div");
          card.classList.add("card");

          const name = document.createElement("h3");
          name.textContent = item.answer;

          const img = document.createElement("img");
          img.src = item.image1;
          img.alt = item.answer;
          const img2 = document.createElement("img");
          img2.src = item.image2;
          img2.alt = item.answer;

          const delBtn = document.createElement("button");
          delBtn.textContent = "Delete";
          delBtn.classList.add("delete-btn");
          delBtn.onclick = () => deleteItem(item.id);

          card.appendChild(name);
          card.appendChild(img);
          card.appendChild(img2);
          card.appendChild(delBtn);
          content.appendChild(card);
        });
      }

      function deleteItem(id) {
        fetch(`/details/${id}`, { method: "DELETE" })
          .then((res) => {
            if (!res.ok) throw new Error("Delete failed");
            return res.json();
          })
          .then(() => fetchDetails())
          .catch((err) => console.error("Delete error:", err.message));
      }
    </script>
  </body>
</html>
