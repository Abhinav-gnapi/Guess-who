<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Buttons</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        a {
            text-decoration: none;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn {
            background-color: #4CAF50;
            color: white;
        }

        .quiz-btn {
            background-color: #2196F3;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="button-container">
        <a href="adminDashboard.html">
            <button class="add-btn">Add Details</button>
        </a>
        <a href="viewDetails.html">
            <button class="add-btn">View Details</button>
        </a>

        <button class="quiz-btn" onclick="start()">Start Quiz</button>
        <a href="adminResults.html">
            <button class="add-btn">View Result</button>
        </a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function start() {
            socket.emit("startQuiz");
        }
  </script>
</body>
</html>
