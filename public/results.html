<!DOCTYPE html>
<html>
<head>
  <title>Quiz Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 50%;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <h1>Quiz Results</h1>

  <table>
    <thead>
      <tr>
        <th>User</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>

  <script>
  const results = JSON.parse(sessionStorage.getItem("quizResults")) || {};
  const tbody = document.getElementById("resultsBody");

  for (const user in results) {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${results[user].username}</td>
      <td>${results[user].score}</td>
    `;
    tbody.appendChild(row);
  }

  // 🔥 SEND RESULTS TO ADMIN (BACKEND)
  fetch("https://https://guess-who-amw8.onrender.com/admin/results", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      gameId: "quiz-001",   // optional
      results: results,
      submittedAt: new Date()
    })
  })
  .then(res => res.json())
  .then(data => console.log("Results sent to admin"))
  .catch(err => console.error("Error sending results:", err));
</script>


</body>
</html>
